plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.fitcheckai'
version = '0.1.0'

android {
  namespace "expo.modules.fitcheckai"
  defaultConfig {
    // ML Kit GenAI (Gemini Nano) requires Android 8.0+.
    minSdkVersion 26
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // On-device Gemini Nano via ML Kit GenAI Prompt API.
  implementation "com.google.mlkit:genai-prompt:1.0.0-beta4"
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"
}
